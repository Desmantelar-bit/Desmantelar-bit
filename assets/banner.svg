<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="50%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- Ambient glow blobs -->
  <circle cx="200" cy="80" r="120" fill="#7aa2f7" opacity="0.08" filter="url(#blur)"/>
  <circle cx="1050" cy="280" r="140" fill="#bb9af7" opacity="0.1" filter="url(#blur)"/>
  <circle cx="640" cy="180" r="180" fill="#7dcfff" opacity="0.05" filter="url(#blur)"/>

  <!-- Network lines -->
  <g stroke="url(#glow)" stroke-width="1.2" opacity="0.45" fill="none">
    <line x1="120" y1="90" x2="280" y2="160"/>
    <line x1="280" y1="160" x2="420" y2="100"/>
    <line x1="420" y1="100" x2="560" y2="200"/>
    <line x1="560" y1="200" x2="720" y2="120"/>
    <line x1="720" y1="120" x2="880" y2="220"/>
    <line x1="880" y1="220" x2="1040" y2="140"/>
    <line x1="1040" y1="140" x2="1180" y2="200"/>
    <line x1="280" y1="160" x2="340" y2="280"/>
    <line x1="560" y1="200" x2="640" y2="300"/>
    <line x1="720" y1="120" x2="800" y2="60"/>
    <line x1="880" y1="220" x2="960" y2="300"/>
    <line x1="420" y1="100" x2="480" y2="40"/>
    <line x1="200" y1="250" x2="340" y2="280"/>
    <line x1="640" y1="300" x2="800" y2="280"/>
  </g>

  <!-- Nodes -->
  <g filter="url(#softGlow)">
    <circle cx="120" cy="90" r="6" fill="#7aa2f7"/>
    <circle cx="280" cy="160" r="9" fill="#bb9af7"/>
    <circle cx="420" cy="100" r="7" fill="#7dcfff"/>
    <circle cx="560" cy="200" r="11" fill="#7aa2f7"/>
    <circle cx="720" cy="120" r="8" fill="#bb9af7"/>
    <circle cx="880" cy="220" r="10" fill="#7dcfff"/>
    <circle cx="1040" cy="140" r="7" fill="#7aa2f7"/>
    <circle cx="1180" cy="200" r="6" fill="#bb9af7"/>
    <circle cx="340" cy="280" r="5" fill="#7aa2f7"/>
    <circle cx="640" cy="300" r="6" fill="#bb9af7"/>
    <circle cx="800" cy="60" r="5" fill="#7dcfff"/>
    <circle cx="960" cy="300" r="5" fill="#7aa2f7"/>
    <circle cx="480" cy="40" r="4" fill="#bb9af7"/>
    <circle cx="200" cy="250" r="4" fill="#7dcfff"/>
    <circle cx="800" cy="280" r="5" fill="#7aa2f7"/>
  </g>

  <!-- Accent bar at bottom -->
  <rect x="0" y="350" width="1280" height="10" fill="url(#glow)" opacity="0.7"/>

  <!-- Subtle grid -->
  <g stroke="#7aa2f7" stroke-width="0.3" opacity="0.08">
    <line x1="0" y1="90" x2="1280" y2="90"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="270" x2="1280" y2="270"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
  </g>
</svg>
